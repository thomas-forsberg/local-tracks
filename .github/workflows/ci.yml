name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-jvm:
    name: Shared core (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:jvmTest :shared:verifySqlDelightMigration

  ios:
    name: iOS (Kotlin + Swift tests on simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Xcode version
        run: xcodebuild -version
      - name: Shared core on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build app and run Swift tests
        run: |
          # Simulator names change with each Xcode version, so take the first available iPhone.
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project iosApp/LocalTracks.xcodeproj -scheme LocalTracks \
            -configuration Debug -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test
