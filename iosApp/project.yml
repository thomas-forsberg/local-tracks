# Source of truth for the Xcode project. Generate it with: cd iosApp && xcodegen
name: LocalTracks

options:
  bundleIdPrefix: no.thomasforsberg
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LocalTracks:
    type: application
    platform: iOS
    sources:
      - path: LocalTracks
      # Referenced by the scheme for Xcode location simulation; not bundled into the app.
      - path: ../fixtures/gpx
        buildPhase: none
    info:
      path: LocalTracks/Info.plist
      properties:
        CFBundleDisplayName: Local Tracks
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.thomasforsberg.localtracks
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # The Kotlin build phase runs Gradle, which reads files outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  LocalTracks:
    build:
      targets:
        LocalTracks: all
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: ../fixtures/gpx/synthetic-sognsvann-loop.gpx
    test:
      config: Debug
    archive:
      config: Release
