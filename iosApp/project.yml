# Source of truth for the Xcode project. Generate it with: cd iosApp && xcodegen
name: LocalTracks

options:
  bundleIdPrefix: no.thomasforsberg
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Kotlin builds only the arm64 simulator slice; Intel simulators aren't supported.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Lets every target `import Shared`. Only the app links it (see OTHER_LDFLAGS below);
    # the tests run inside the app and use its copy, so there is one Kotlin runtime.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

targets:
  LocalTracks:
    type: application
    platform: iOS
    sources:
      - path: LocalTracks
      # Referenced by the scheme for Xcode location simulation; not bundled into the app.
      - path: ../fixtures/gpx
        buildPhase: none
    info:
      path: LocalTracks/Info.plist
      properties:
        CFBundleDisplayName: Local Tracks
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keeps recording with the screen locked; iOS shows the blue location indicator.
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: >-
          Local Tracks records your route while you record an activity.
          Your location never leaves your phone.
        NSMotionUsageDescription: >-
          Local Tracks uses the barometer to measure elevation.
          The data never leaves your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.thomasforsberg.localtracks
        CODE_SIGN_STYLE: Automatic
        # The Kotlin build phase runs Gradle, which reads files outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Shared is a static framework, so the app links SQLite for it.
        OTHER_LDFLAGS: [$(inherited), -framework, Shared, -lsqlite3]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  LocalTracksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalTracksTests
    dependencies:
      - target: LocalTracks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.thomasforsberg.localtracks.tests
        GENERATE_INFOPLIST_FILE: YES

  LocalTracksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LocalTracksUITests
    dependencies:
      - target: LocalTracks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.thomasforsberg.localtracks.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Kept out of the LocalTracks scheme so CI and everyday test runs stay fast.
  ScreenshotTour:
    build:
      targets:
        LocalTracks: all
        LocalTracksUITests: [test]
    test:
      config: Debug
      targets:
        - LocalTracksUITests

  LocalTracks:
    build:
      targets:
        LocalTracks: all
        LocalTracksTests: [test]
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: ../fixtures/gpx/synthetic-sognsvann-loop.gpx
    test:
      config: Debug
      targets:
        - LocalTracksTests
    archive:
      config: Release
